name: MVP Python checks

on:
  push:
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'web/**'
      - 'deploy/**'
      - 'requirements*.txt'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - '.github/workflows/mvp-tests.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install integration dependencies
        run: python -m pip install -r requirements-web.txt httpx
      - name: Python syntax checks
        run: python -m compileall -q tools tests deploy
      - name: Browser JavaScript syntax checks
        run: find web -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Authentication and rate-limit unit tests
        run: python -m unittest discover -s tests -p 'test_login_mvp.py' -v && python -m unittest discover -s tests -p 'test_limites_api.py' -v && python -m unittest discover -s tests -p 'test_http_mvp.py' -v && python -m unittest discover -s tests -p 'test_pipeline_colmap.py' -v && python -m unittest discover -s tests -p 'test_exportaciones_mvp.py' -v && python -m unittest discover -s tests -p 'test_recuperacion_exportaciones.py' -v

  docker-mvp-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build actual application container with COLMAP
        run: docker build -t escaneo3d-mvp .
      - name: Check COLMAP executable inside container
        run: docker run --rm --entrypoint /bin/sh escaneo3d-mvp -c 'command -v colmap && colmap -h >/dev/null'
      - name: Start production-mode backend and validate authenticated API
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          salt = os.urandom(16)
          password = "ci-local-test-password"
          digest = hashlib.pbkdf2_hmac("sha256", password.encode(), salt, 600000)
          values = {
              "ESCANEO3D_ENV": "production",
              "ESCANEO3D_AUTH_REQUIRED": "1",
              "ESCANEO3D_JWT_SECRET": os.urandom(40).hex(),
              "ESCANEO3D_JWT_ISSUER": "escaneo3d-ci",
              "ESCANEO3D_JWT_AUDIENCE": "escaneo3d-ci-client",
              "ESCANEO3D_MVP_USER": "ci-tester",
              "ESCANEO3D_MVP_PASSWORD_HASH": "pbkdf2_sha256$600000$" + salt.hex() + "$" + digest.hex(),
          }
          Path("/tmp/escaneo3d-ci.env").write_text(
              "".join(f"{key}={value}\\n" for key, value in values.items()))
          PY
          docker run -d --name escaneo3d-smoke --env-file /tmp/escaneo3d-ci.env -p 127.0.0.1:18000:8000 escaneo3d-mvp
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18000/api/salud >/dev/null; then break; fi
            sleep 2
          done
          printf '%s\\n' 'ci-local-test-password' | python deploy/smoke_mvp.py http://127.0.0.1:18000 --usuario ci-tester
      - name: Container logs
        if: always()
        run: docker logs escaneo3d-smoke 2>&1 || true
