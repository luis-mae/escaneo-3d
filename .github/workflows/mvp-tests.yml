name: MVP Python checks

on:
  push:
    paths:
      - 'tools/auth.py'
      - 'tools/login_mvp.py'
      - 'tools/limites_api.py'
      - 'tests/test_login_mvp.py'
      - 'tests/test_limites_api.py'
      - 'tests/test_http_mvp.py'
      - '.github/workflows/mvp-tests.yml'
      - 'tools/servidor_web.py'
      - 'web/**'
      - 'docker-compose.production.yml'
      - 'deploy/smoke_mvp.py'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install integration dependencies
        run: python -m pip install -r requirements-web.txt httpx
      - name: Python syntax checks
        run: python -m py_compile tools/auth.py tools/login_mvp.py tools/limites_api.py tools/servidor_web.py tests/test_login_mvp.py tests/test_limites_api.py tests/test_http_mvp.py deploy/smoke_mvp.py
      - name: Browser JavaScript syntax checks
        run: node --check web/app.js && node --check web/sesion_remota.js && node --check web/visor.js && node --check web/sw.js
      - name: Authentication and rate-limit unit tests
        run: python -m unittest discover -s tests -p 'test_login_mvp.py' -v && python -m unittest discover -s tests -p 'test_limites_api.py' -v && python -m unittest discover -s tests -p 'test_http_mvp.py' -v
