name: MVP Python checks

on:
  push:
    paths:
      - 'tools/auth.py'
      - 'tools/login_mvp.py'
      - 'tools/limites_api.py'
      - 'tests/test_login_mvp.py'
      - 'tests/test_limites_api.py'
      - 'tests/test_http_mvp.py'
      - 'tests/test_pipeline_colmap.py'
      - 'tests/test_exportaciones_mvp.py'
      - 'tools/pipeline_colmap.py'
      - '.github/workflows/mvp-tests.yml'
      - 'tools/servidor_web.py'
      - 'web/**'
      - 'docker-compose.production.yml'
      - 'deploy/smoke_mvp.py'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install integration dependencies
        run: python -m pip install -r requirements-web.txt httpx
      - name: Python syntax checks
        run: python -m compileall -q tools tests deploy
      - name: Browser JavaScript syntax checks
        run: find web -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Authentication and rate-limit unit tests
        run: python -m unittest discover -s tests -p 'test_login_mvp.py' -v && python -m unittest discover -s tests -p 'test_limites_api.py' -v && python -m unittest discover -s tests -p 'test_http_mvp.py' -v && python -m unittest discover -s tests -p 'test_pipeline_colmap.py' -v && python -m unittest discover -s tests -p 'test_exportaciones_mvp.py' -v
