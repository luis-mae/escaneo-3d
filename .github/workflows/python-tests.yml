name: Backend and frontend tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate browser JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/visor.js
          node tests/test_visor.js
          node tests/test_stl_calibrado.js
          node tests/test_mediciones_malla.js
      - name: Run complete test suite
        run: python -m pytest -q --junitxml=pytest-results.xml
      - name: Upload Python test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: escaneo3d-pytest-results
          path: pytest-results.xml
          if-no-files-found: warn
          retention-days: 14

  windows-mvp:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Windows recovery and conversion tests
        run: python -m pytest -q tests/test_reanudar_sesion_mvp.py tests/test_verificar_sesion_mvp.py tests/test_diagnosticos_mvp.py tests/test_procesar_nube_mvp.py --junitxml=windows-mvp-results.xml
      - name: Upload Windows MVP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: escaneo3d-windows-mvp-results
          path: windows-mvp-results.xml
          if-no-files-found: warn
          retention-days: 14
