<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escaneo3D · Visor de mallas</title><style>body{background:#101827;color:#f2f6fb;font:16px system-ui;max-width:900px;margin:auto;padding:18px}a{color:#61dbad}canvas{width:100%;height:65vh;background:#17243a;border-radius:12px;touch-action:none}input,button{font:inherit;padding:10px;background:#263950;color:white;border:1px solid #60718a;border-radius:8px}#msg{color:#d3e2f5}</style></head><body><h1>Visor de modelos 3D</h1><p><a href="index.html">← Volver a captura</a></p><p>Importá una malla STL (binaria o ASCII) u OBJ para verla sin subir archivos a servidores. Arrastrá para girar; usá la rueda o dos dedos para acercar.</p><p><a href="convertir.html">Convertir STL / OBJ / PLY →</a></p><input id="file" type="file" accept=".stl,.obj"><p id="msg">Esperando archivo. Este visor no reconstruye modelos desde fotografías.</p><canvas id="cv"></canvas><script>
'use strict';const cv=document.querySelector('#cv'),ctx=cv.getContext('2d'),msg=document.querySelector('#msg');let vertices=[],faces=[],ax=.35,ay=.5,zoom=1,down=null;const maxTriangles=180000;
function parseOBJ(s){const v=[],f=[];for(const l of s.split(/\r?\n/)){const p=l.trim().split(/\s+/);if(p[0]==='v'&&p.length>=4)v.push(p.slice(1,4).map(Number));if(p[0]==='f'&&p.length>=4){const ids=p.slice(1).map(t=>{const i=Number(t.split('/')[0]);return i<0?v.length+i:i-1});for(let i=1;i<ids.length-1;i++)f.push([ids[0],ids[i],ids[i+1]])}}return [v,f]}
function parseSTL(b){const d=new DataView(b),v=[],f=[];const count=b.byteLength>=84?d.getUint32(80,true):0;if(84+count*50===b.byteLength){if(count>maxTriangles)throw Error('Archivo demasiado grande para este visor');for(let i=0;i<count;i++){const o=84+i*50+12,base=v.length;for(let j=0;j<3;j++)v.push([d.getFloat32(o+j*12,true),d.getFloat32(o+j*12+4,true),d.getFloat32(o+j*12+8,true)]);f.push([base,base+1,base+2])}}else{const s=new TextDecoder().decode(b),r=/vertex\s+([-+\deE.]+)\s+([-+\deE.]+)\s+([-+\deE.]+)/g;let m;while((m=r.exec(s))){v.push([+m[1],+m[2],+m[3]]);if(v.length%3===0)f.push([v.length-3,v.length-2,v.length-1]);if(f.length>maxTriangles)throw Error('Archivo demasiado grande para este visor')}}return [v,f]}
function render(){const rect=cv.getBoundingClientRect(),w=Math.max(1,Math.round(rect.width*devicePixelRatio)),h=Math.max(1,Math.round(rect.height*devicePixelRatio));if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}ctx.clearRect(0,0,w,h);if(!vertices.length)return;const ca=Math.cos(ax),sa=Math.sin(ax),cb=Math.cos(ay),sb=Math.sin(ay),scale=Math.min(w,h)*.42*zoom;const pts=vertices.map(([x,y,z])=>{const xx=x*cb+z*sb,zz=-x*sb+z*cb,yy=y*ca-zz*sa;return [w/2+xx*scale,h/2-yy*scale, y*sa+zz*ca]});const sorted=faces.map(f=>[f,(pts[f[0]][2]+pts[f[1]][2]+pts[f[2]][2])/3]).sort((a,b)=>a[1]-b[1]);for(const [f] of sorted){if(f.some(i=>!pts[i]))continue;const [a,b,c]=f.map(i=>pts[i]);const cross=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);const brightness=Math.max(28,Math.min(75,48+cross/(scale*scale)*90));ctx.fillStyle=`hsl(165 45% ${brightness}%)`;ctx.strokeStyle='rgba(10,20,33,.18)';ctx.lineWidth=.7*devicePixelRatio;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.closePath();ctx.fill();ctx.stroke()}}
cv.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!down)return;ay+=(e.clientX-down[0])*.008;ax+=(e.clientY-down[1])*.008;down=[e.clientX,e.clientY];render()});cv.addEventListener('pointerup',()=>down=null);cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.15,Math.min(8,zoom*Math.exp(-e.deltaY*.001)));render()},{passive:false});let pinch=null;cv.addEventListener('touchmove',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1],dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinch)zoom=Math.max(.15,Math.min(8,zoom*dist/pinch));pinch=dist;render()}},{passive:false});cv.addEventListener('touchend',()=>pinch=null);
document.querySelector('#file').addEventListener('change',async e=>{try{const file=e.target.files[0];if(!file)return;const parsed=file.name.toLowerCase().endsWith('.obj')?parseOBJ(await file.text()):parseSTL(await file.arrayBuffer());if(!parsed[0].length||!parsed[1].length)throw Error('No se encontraron triángulos');if(parsed[1].length>maxTriangles)throw Error('Demasiados triángulos');const valid=parsed[1].every(f=>f.every(i=>Number.isInteger(i)&&i>=0&&i<parsed[0].length))&&parsed[0].every(v=>v.every(Number.isFinite));if(!valid)throw Error('Geometría inválida');const mins=[Infinity,Infinity,Infinity],maxs=[-Infinity,-Infinity,-Infinity];for(const v of parsed[0])for(let j=0;j<3;j++){mins[j]=Math.min(mins[j],v[j]);maxs[j]=Math.max(maxs[j],v[j])}const center=mins.map((n,i)=>(n+maxs[i])/2),extent=Math.max(...maxs.map((n,i)=>n-mins[i]));if(!extent)throw Error('Modelo sin volumen');vertices=parsed[0].map(v=>v.map((n,i)=>(n-center[i])/extent));faces=parsed[1];zoom=1;msg.textContent=`${file.name}: ${faces.length.toLocaleString('es')} triángulos. Dimensiones en unidades del archivo: ${maxs.map((n,i)=>(n-mins[i]).toFixed(2)).join(' × ')}. Sin verificación de escala.`;render()}catch(err){msg.textContent='No se pudo abrir: '+err.message}});new ResizeObserver(render).observe(cv);
</script></body></html>
