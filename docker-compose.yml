services:
  escaneo3d:
    build: .
    container_name: escaneo3d-local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ESCANEO3D_DATA: /data
      ESCANEO3D_BILLING_DB: /data/entitlements.sqlite3
      ESCANEO3D_AUTH_REQUIRED: ${ESCANEO3D_AUTH_REQUIRED:-0}
      ESCANEO3D_JWT_SECRET: ${ESCANEO3D_JWT_SECRET:-}
      ESCANEO3D_JWT_ISSUER: ${ESCANEO3D_JWT_ISSUER:-}
      ESCANEO3D_JWT_AUDIENCE: ${ESCANEO3D_JWT_AUDIENCE:-}
    volumes:
      - escaneo3d_data:/data
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  escaneo3d_data:
